name: CI

# `homolog` entra nos gatilhos DESDE JÁ, antes de qualquer status check virar
# obrigatório. O repositório-base dispara só em [develop, main]; com a branch de
# homologação fora da lista, um PR para ela nunca dispara o CI, o check fica
# eternamente em "Expected — Waiting for status to be reported", e com a lista de
# bypass vazia nem o PR que consertaria isso consegue ser mergeado.
on:
  pull_request:
    branches: [develop, homolog, main]
  push:
    branches: [develop, homolog, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  commits:
    name: Commits e título do PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Validar o título do PR
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          # Com squash merge, o TÍTULO do PR é o que vira a mensagem final no
          # develop — por isso ele é validado, e não só os commits.
          if ! printf '%s' "$TITULO" | grep -qE '^(feat|fix|docs|chore|refactor|style|test|perf|build|ci|revert)(\([a-z0-9-]+\))?!?: .{1,}$'; then
            echo "::error::Título fora do Conventional Commits: '$TITULO'"
            exit 1
          fi
          if [ ${#TITULO} -gt 72 ]; then
            echo "::error::Título com ${#TITULO} caracteres; o limite é 72"
            exit 1
          fi
          if printf '%s' "$TITULO" | grep -qE '^(refact|refator|config|merge):'; then
            echo "::error::Tipo proibido. Use refactor:, chore: ou ci: conforme o caso."
            exit 1
          fi

  qualidade:
    name: Lint, build e testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Typecheck do código de produção
        run: npx tsc --noEmit -p tsconfig.build.json

      # BLOQUEANTE, com --max-warnings=0. O repositório-base roda o lint com
      # `continue-on-error: true` porque carrega um baseline datado de 136 erros
      # e 460 avisos; este repositório nasceu limpo, então copiar aquilo seria
      # regressão deliberada no primeiro commit.
      #
      # Sem `--fix`, de propósito: `--fix` num runner descartável corrige em
      # silêncio e joga o problema fora junto com o container.
      - name: Lint
        run: npx eslint "src/**/*.ts" --max-warnings=0

      - name: Build
        run: npm run build

      - name: Testes unitários
        run: npm run test:ci

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-unit
          path: coverage/
          retention-days: 7

  seguranca:
    name: Segurança
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Auditoria de dependências
        run: npm audit --audit-level=high

      - name: Nenhuma chave estática da AWS nos workflows
        run: |
          # Casa o USO (`secrets.AWS_...` ou `AWS_...:` como variável de
          # ambiente), não a menção — procurar o nome solto faria este guard
          # falhar contra o próprio texto dele.
          if grep -rInE 'secrets\.AWS_(ACCESS_KEY_ID|SECRET_ACCESS_KEY)|AWS_(ACCESS_KEY_ID|SECRET_ACCESS_KEY)[[:space:]]*:' .github/ ; then
            echo "::error::credencial estática encontrada — o acesso à AWS é por OIDC"
            exit 1
          fi

      - name: Chave do AWS Academy só com session token
        run: |
          # O AWS Academy não permite criar a role do OIDC, e o deploy aceita as
          # credenciais do lab como alternativa. Elas só são aceitáveis porque são
          # TEMPORÁRIAS: sem session token, uma chave ali seria de usuário IAM,
          # válida para sempre.
          for f in $(grep -rlE '^[[:space:]]*aws-access-key-id:' .github/workflows/ || true); do
            grep -qE 'aws-session-token:[[:space:]]*\$\{\{ *secrets\.AWS_LAB_SESSION_TOKEN' "$f" || {
              echo "::error file=$f::aws-access-key-id sem aws-session-token do lab"; exit 1; }
          done

      - name: Nenhum CPF em código de produção
        run: |
          # O risco real é CPF virar DADO em código de produção: literal
          # hardcoded, valor default, formato de log. A massa sintética vive nas
          # specs, e é lá que ela está documentada.
          #
          # COMENTÁRIOS ficam de fora do guard de propósito. O `cpf.vo.ts`
          # documenta exatamente quais entradas seriam aceitas por engano pelo
          # validador do repositório-base — é a justificativa de existir da regra
          # de formato. Apagar esse exemplo para satisfazer um grep seria deixar
          # a ferramenta piorar o código.
          if grep -rInE '[^0-9][0-9]{11}[^0-9]' src --include='*.ts' \
               | grep -v '\.spec\.ts:' \
               | grep -vE ':[[:space:]]*(//|\*|/\*)' ; then
            echo "::error::sequencia de 11 digitos em codigo de producao"
            exit 1
          fi

  terraform:
    name: Terraform da função
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.10.5'
          terraform_wrapper: false

      - name: Formatação
        run: terraform fmt -check -recursive infra/terraform

      - name: Validate dos ambientes
        run: |
          for env in staging prod; do
            terraform -chdir=infra/terraform/envs/$env init -backend=false -input=false
            terraform -chdir=infra/terraform/envs/$env validate
          done

      # Provider mockado: sem credencial, sem criar nada. Prova nome da função,
      # LabRole, paths do SSM e rede, que são contrato com o Kong e os outros repos.
      - name: Testes do módulo
        working-directory: infra/terraform/modules/function
        run: terraform init -backend=false -input=false && terraform test

  imagem:
    name: Imagem e invocação local
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build da imagem
        run: docker build --provenance=false -t techchallenge-auth:ci .

      # A imagem base da Lambda traz o Runtime Interface Emulator. Sem AWS, o
      # bootstrap falha no SSM, e o contrato manda responder 503 com
      # correlationId, não estourar. Isso prova, na imagem real, que o handler
      # está no CMD certo, que o bundle de CAs existe e que o evento v1.0 do Kong
      # é aceito.
      - name: Evento v1.0 do Kong contra a imagem
        run: |
          docker run -d --name fn -p 9000:8080 \
            -e APP_ENV=ci -e JWT_SECRET_SSM_PATH=/ci/auth/jwt-secret -e DB_SSM_PREFIX=/ci/db \
            -e AWS_REGION=us-east-1 -e AWS_EC2_METADATA_DISABLED=true \
            techchallenge-auth:ci
          docker exec fn test -s /var/task/certs/global-bundle.pem
          # O `docker exec` acima roda como root e passa mesmo com o diretório sem
          # o bit x. A Lambda real roda sem privilégio, então a leitura é provada
          # com um usuário qualquer diferente de root.
          docker run --rm --user 1000 --entrypoint sh techchallenge-auth:ci \
            -c 'head -c1 /var/task/certs/global-bundle.pem >/dev/null'
          for i in $(seq 1 20); do curl -s -o /dev/null localhost:9000 && break; sleep 1; done
          body=$(printf '{"cpf":"11144477735"}' | base64 -w0)
          curl -sS -o resp.json localhost:9000/2015-03-31/functions/function/invocations \
            -d "{\"httpMethod\":\"POST\",\"path\":\"/auth\",\"headers\":{\"x-correlation-id\":\"ci-kong#1\"},\"body\":\"${body}\",\"isBase64Encoded\":true,\"requestContext\":{\"requestId\":\"ci-req\"}}"
          cat resp.json; echo
          jq -e '.statusCode == 503 and .headers["x-correlation-id"] == "ci-kong#1" and (.body | fromjson | .error == "service_unavailable")' resp.json
          docker logs fn 2>&1 | grep -q '"event":"bootstrap.error"'
